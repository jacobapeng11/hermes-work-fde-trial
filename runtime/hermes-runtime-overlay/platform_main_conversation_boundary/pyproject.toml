[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-hermes-platform-main-conversation-boundary"
version = "0.1.0"
requires-python = ">=3.11,<3.14"

[project.entry-points."hermes_agent.plugins"]
platform-main-conversation-boundary-v1 = "platform_main_conversation_boundary.plugin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["platform_main_conversation_boundary*"]
