<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>数据看板</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --card: #fff;
      --text: #16213a;
      --muted: #5f6f88;
      --primary: #1d5ef3;
      --border: #dce4f0;
      --ok: #12805c;
      --warn: #a05b00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.6 Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    main { max-width: 1180px; margin: 0 auto; }
    h1 { margin: 0; font-size: 22px; line-height: 1.3; }
    h2 { margin: 0 0 8px; font-size: 16px; }
    .subtitle { margin: 4px 0 0; color: var(--muted); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin: 16px 0;
      box-shadow: 0 5px 16px rgba(20, 35, 65, .06);
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }
    .summary div {
      background: #f8fafd;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .label { display: block; color: var(--muted); font-size: 12px; }
    .value { display: block; margin-top: 3px; font-size: 17px; font-weight: 700; }
    button {
      border: 0;
      border-radius: 999px;
      min-height: 34px;
      padding: 0 16px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { filter: brightness(.96); }
    .state { font-weight: 700; }
    .state.ok { color: var(--ok); }
    .state.warn { color: var(--warn); }
    .meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .notice {
      margin-top: 10px;
      padding: 8px 10px;
      border-left: 3px solid var(--warn);
      background: #fff7e8;
      border-radius: 5px;
    }
    .table-wrap { overflow-x: auto; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border: 1px solid var(--border); padding: 7px 9px; text-align: left; vertical-align: top; }
    th { background: #edf3fb; white-space: nowrap; }
    td { overflow-wrap: anywhere; }
    .empty { color: var(--muted); margin: 8px 0 0; }
    @media (max-width: 640px) {
      body { padding: 14px; }
      .card { padding: 12px; border-radius: 9px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="card">
      <div>
        <h1>数据看板</h1>
        <p class="subtitle">打开时自动获取最新数据，只显示你有权限看的内容</p>
      </div>
      <div id="reportMeta" class="summary" style="margin-top:14px">
        <div><span class="label">状态</span><span id="state" class="value state">检查中…</span></div>
        <div><span class="label">当前用户</span><span id="user" class="value">—</span></div>
        <div><span class="label">数据时间</span><span id="generatedAt" class="value">—</span></div>
        <div><span class="label">操作</span><span class="value"><button id="refresh" type="button">刷新</button></span></div>
      </div>
      <p id="requestId" class="meta">request_id：—</p>
      <div id="error" hidden class="notice"></div>
    </header>

    <!--
      Agent 必须替换下面 manifest 中的 queries。
      SQL 必须来自 data_service 已配置业务表，并遵守 SKILL.md 的安全规则。
      这里的示例查询仅用于保证模板可作为看板发布。
    -->
    <script type="application/json" id="hermes-report-manifest">
      {
        "engine": "sql_manifest_v1",
        "data_mode": "live",
        "queries": [
          {
            "id": "opportunity_by_region",
            "sql": "SELECT IFNULL(NULLIF(region_name, ''), '未知') AS region_name, COUNT(*) AS opportunity_count, SUM(COALESCE(advance_amount, 0)) AS opportunity_amount_wan FROM crm_project_info_t GROUP BY IFNULL(NULLIF(region_name, ''), '未知') ORDER BY opportunity_amount_wan DESC",
            "page": 1,
            "page_size": 200
          }
        ]
      }
    </script>

    <section id="queries"></section>
  </main>

  <script>
    const queryTitles = new Map([
      ["opportunity_by_region", "商机按区域汇总"]
      // Agent 可按 query id 增加业务标题；未登记的 query 会显示 query id。
    ]);

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatValue(value) {
      if (value === null || value === undefined || value === "") return "—";
      if (typeof value === "number") {
        return Number.isInteger(value) ? value.toLocaleString("zh-CN") : value.toLocaleString("zh-CN", {
          maximumFractionDigits: 2
        });
      }
      return escapeHtml(value);
    }

    function queryCard(id, result) {
      const rows = Array.isArray(result.data) ? result.data : [];
      const columns = rows.length
        ? [...new Set(rows.flatMap(row => Object.keys(row)))]
        : [];
      const warnings = Array.isArray(result.semantic_warnings) ? result.semantic_warnings : [];
      let content = `<p class="empty">该查询没有返回数据。</p>`;
      if (columns.length) {
        content = `<div class="table-wrap"><table><thead><tr>${
          columns.map(column => `<th>${escapeHtml(column)}</th>`).join("")
        }</tr></thead><tbody>${
          rows.map(row => `<tr>${
            columns.map(column => `<td>${formatValue(row[column])}</td>`).join("")
          }</tr>`).join("")
        }</tbody></table></div>`;
      }
      const warningHtml = warnings.length
        ? `<div class="notice">${warnings.map(item => escapeHtml(item?.message || item?.id || "存在语义警告")).join("<br>")}</div>`
        : "";
      return `<article class="card">
        <h2>${escapeHtml(queryTitles.get(id) || id)}</h2>
        <p class="meta">query_id：${escapeHtml(id)} · 返回 ${escapeHtml(result.row_count ?? rows.length)} 行 / 总数 ${escapeHtml(result.total ?? "—")}</p>
        ${content}${warningHtml}
      </article>`;
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("refresh").addEventListener("click", () => location.reload());
      const state = document.getElementById("state");
      const user = document.getElementById("user");
      const generatedAt = document.getElementById("generatedAt");
      const requestId = document.getElementById("requestId");
      const error = document.getElementById("error");
      const container = document.getElementById("queries");
      const dataNode = document.getElementById("hermes-report-data");

      if (!dataNode) {
        state.textContent = "静态预览";
        state.className = "value state warn";
        user.textContent = "—";
        generatedAt.textContent = "—";
        error.hidden = false;
        error.textContent = "当前页面没有平台注入数据。请从看板区卡片打开该报表。";
        container.innerHTML = "";
        return;
      }

      let report;
      try {
        report = JSON.parse(dataNode.textContent);
      } catch (error_) {
        state.textContent = "数据解析失败";
        state.className = "value state warn";
        error.hidden = false;
        error.textContent = "平台注入的数据节点不是有效 JSON，请重新打开报表。";
        return;
      }

      state.textContent = "已更新";
      state.className = "value state ok";
      user.textContent = `${report.user?.name ?? "—"}（${report.user?.user_code ?? "—"}）`;
      generatedAt.textContent = report.generated_at ? String(report.generatedAt).replace("T", " ").replace("Z", " UTC") : "—";
      requestId.textContent = `request_id：${report.request_id || "—"}`;

      const entries = Object.entries(report.queries || {});
      container.innerHTML = entries.length
        ? entries.map(([id, result]) => queryCard(id, result || {})).join("")
        : `<article class="card"><h2>暂无查询结果</h2><p class="empty">平台没有返回查询数据。</p></article>`;
    });
  </script>
</body>
</html>
