[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-platform-supervisor"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  # The Supervisor is installed into Hermes' existing virtualenv. Keep the
  # reviewed compatibility floor without downgrading a newer candidate image.
  "fastapi>=0.115.6,<1",
  "httpx>=0.28.1,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7.1,<3",
  "PyYAML>=6.0.2,<7",
  "uvicorn[standard]>=0.34.0,<1",
  "websockets>=15.0.1,<17",
  "watchfiles==1.1.1",
]

[project.scripts]
platform-supervisor = "platform_supervisor.main:run"
platform-supervisor-privileged-entry = "platform_supervisor.supervisor_privileged_entry:main"
platform-hermes-child-exec = "platform_supervisor.hermes_child_exec:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
where = ["."]
include = ["platform_supervisor*"]
