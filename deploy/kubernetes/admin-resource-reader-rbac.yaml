apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-admin-resource-reader
  namespace: hermes-runtimes
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: hermes-admin-resource-reader-token
  namespace: hermes-runtimes
  annotations:
    kubernetes.io/service-account.name: hermes-admin-resource-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-admin-resource-cluster-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-admin-resource-cluster-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-admin-resource-cluster-reader
subjects:
  - kind: ServiceAccount
    name: hermes-admin-resource-reader
    namespace: hermes-runtimes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-admin-runtime-resources
  namespace: hermes-runtimes
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["serving.knative.dev"]
    resources: ["services", "routes", "configurations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["serving.knative.dev"]
    resources: ["revisions"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["autoscaling.internal.knative.dev"]
    resources: ["podautoscalers"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-admin-runtime-resources
  namespace: hermes-runtimes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-admin-runtime-resources
subjects:
  - kind: ServiceAccount
    name: hermes-admin-resource-reader
    namespace: hermes-runtimes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-admin-control-plane-reader
  namespace: knative-serving
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-admin-control-plane-reader
  namespace: knative-serving
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-admin-control-plane-reader
subjects:
  - kind: ServiceAccount
    name: hermes-admin-resource-reader
    namespace: hermes-runtimes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-admin-control-plane-reader
  namespace: kourier-system
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-admin-control-plane-reader
  namespace: kourier-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-admin-control-plane-reader
subjects:
  - kind: ServiceAccount
    name: hermes-admin-resource-reader
    namespace: hermes-runtimes
